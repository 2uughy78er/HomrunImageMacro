name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          mkdir project
          unzip -q HomerunImageMacro.zip -d project

      - name: Find Android project
        run: |
          ROOT=$(dirname "$(find project -name settings.gradle -o -name settings.gradle.kts | head -1)")
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          gradle --no-daemon assembleDebug

      - name: Find APK
        run: |
          find "$PROJECT_ROOT" -name "*.apk" -exec cp {} ./HomerunImageMacro-debug.apk \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HomerunImageMacro
          path: HomerunImageMacro-debug.apk
